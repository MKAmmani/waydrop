<html lang="en">

<meta charset="utf-8" />

<title>Your errand · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== APP SHELL ============== */
/* Phone: full-screen page + floating bottom bar.
   Computer (1024px and up): left menu + page, like a normal web app. */
.app { min-height: 100vh; }
.side { display: none; }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .side {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh;
    padding: 20px 14px 16px; background: var(--card); border-right: 1px solid var(--border);
  }
  .bottom-bar { display: none !important; }
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font: 800 19px var(--display); letter-spacing: -.02em; }
.side-brand svg { width: 32px; height: 32px; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--ink); color: #fff; }
.nav-item .nav-badge { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--tangerine); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.nav-send { margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--r-pill); background: var(--tangerine); color: #fff; font-weight: 600; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
.side-foot .nm { font-weight: 600; font-size: 14px; } .side-foot .role { font-size: 12px; color: var(--ink-3); }

/* floating bottom bar (phone): active tab is a black circle */
.bottom-bar {
  position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40;
  height: 68px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-float);
  display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
  max-width: 440px; margin: 0 auto;
}
.bb-item { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); position: relative; }
.bb-item.active { background: var(--ink); color: #fff; }
.bb-item.send { background: var(--tangerine); color: #fff; }
.bb-item .dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--tangerine); border: 2px solid var(--card); }

.track { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
.map-area { position: relative; height: 46vh; flex: none; }
#map { position: absolute; inset: 0; background: #EEF0F3; }
.leaflet-tile-pane { filter: saturate(.35) brightness(1.03); }
.leaflet-control-attribution { font-size: 10px; }
.mk-photo { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(15,23,42,.2); overflow: hidden; }
.mk-photo img { width: 100%; height: 100%; display: block; }
.mk-me { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 4px solid #fff; box-shadow: 0 0 0 10px rgba(255,85,0,.16); }
.mk-tag { display: inline-block; transform: translate(-50%, -150%); white-space: nowrap; background: #fff; border-radius: var(--r-pill); padding: 5px 10px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow-1); }
.float-btn { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; z-index: 500; width: 46px; height: 46px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-2); display: grid; place-items: center; }
.panel { flex: 1; margin-top: -24px; position: relative; z-index: 600; background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 20px 20px 32px; }
.panel-inner { max-width: 560px; margin: 0 auto; }
.panel h1 { font: 800 24px/1.15 var(--display); margin: 0; }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink-4); }
.steps3 i { display: block; height: 5px; border-radius: 4px; background: var(--border); margin-bottom: 6px; }
.steps3 .on { color: var(--ink); } .steps3 .on i { background: var(--mint); }
.budget { margin-top: 16px; padding: 14px 16px; }
.bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-top: 10px; } .bar i { display: block; height: 100%; background: var(--mint); }
.receipt { display: flex; gap: 12px; align-items: center; margin-top: 12px; padding: 12px; }
.receipt .ph { width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #D6C2A8, #B89A78); flex: none; }
.who { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 16px; }
.who img { width: 48px; height: 48px; border-radius: 50%; }
.who .t { flex: 1; }
.act { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; width: 100%; border-radius: var(--r-pill); font-weight: 600; font-size: 16px; }
.btn-dark { background: var(--ink); color: #fff; } .btn-light { background: var(--card); box-shadow: var(--shadow-1); }
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.caption { font-size: 13px; color: var(--ink-3); }
/* decision sheet (price check, swap) */
.sheet-dim { position: fixed; inset: 0; z-index: 1000; background: rgba(15,23,42,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 22px 20px max(26px, env(safe-area-inset-bottom)); animation: up .4s var(--spring); }
@keyframes up { from { transform: translateY(100%); } }
.ask-card { position: relative; border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--border); }
.ask-card::before, .ask-card::after { content: ""; position: absolute; top: 78px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.ask-card::before { left: -9px; clip-path: inset(0 0 0 50%); } .ask-card::after { right: -9px; clip-path: inset(0 50% 0 0); }
.ask-top { padding: 16px; border-bottom: 1px dashed var(--border); min-height: 86px; }
.ask-top .k { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--tangerine-fg); }
.timer { background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 4px 10px; font: 700 13px var(--font); font-variant-numeric: tabular-nums; }
.ask-top h2 { font: 800 19px/1.2 var(--display); margin: 8px 0 0; }
.ask-bottom { padding: 12px 16px; }
.calc { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; color: var(--ink-2); } .calc b { font-family: var(--display); color: var(--ink); }
.row2 { display: flex; gap: 10px; margin-top: 10px; }
@media (min-width: 1024px) { .track { flex-direction: row; } .map-area { height: 100vh; flex: 1; order: 2; } .panel { order: 1; width: 440px; flex: none; margin: 0; border-radius: 0; overflow-y: auto; height: 100vh; } .float-btn { display: none; } }
[hidden] { display: none !important; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: var(--r-pill); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.sec-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.btn-danger { background: var(--rose-tint); color: var(--rose-fg); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-2); font-size: 14px; }
.row:last-child { border-bottom: 0; } .row .t { flex: 1; color: var(--ink-2); }
.pin-box { margin-top: 12px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--mint-tint); }
.pin-row { display: flex; gap: 8px; margin-top: 8px; }
.pin-row span { flex: 1; height: 58px; border-radius: var(--r-md); background: var(--card); display: grid; place-items: center; font: 800 28px var(--display); color: var(--mint-fg); }
.pin-small { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--mint-tint); font-size: 14px; font-weight: 600; }
.pin-small .d { margin-left: auto; display: flex; gap: 4px; } .pin-small .d span { width: 30px; height: 36px; border-radius: 9px; background: var(--card); display: grid; place-items: center; font: 800 16px var(--display); color: var(--mint-fg); }
.photo { display: flex; gap: 12px; align-items: center; margin-top: 12px; padding: 12px; }
.photo .ph { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg, #D6C2A8, #A97D52); flex: none; position: relative; }
.photo .ph::after { content: ""; position: absolute; left: 20px; top: 14px; width: 24px; height: 34px; border-radius: 4px; background: #F1F5F9; }
.yesno { display: flex; gap: 6px; margin-top: 8px; }
.yesno a, .yesno button { height: 34px; padding: 0 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; }
.yes { background: var(--ink); color: #fff; } .no { box-shadow: inset 0 0 0 1px var(--border); color: var(--ink-2); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); margin-bottom: 14px; font-size: 14px; color: var(--ink-2); }
.banner.butter { background: var(--butter-tint); } .banner.butter i { color: var(--butter-fg); }
.links { display: flex; gap: 8px; margin-top: 12px; }
.links a, .links button { flex: 1; height: 44px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-1); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.eta-pill { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 500; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: var(--r-pill); background: var(--ink); color: #fff; font-size: 14px; }
.eta-pill b { font: 800 16px var(--display); color: #6EE7B7; }
.toast { position: fixed; left: 50%; top: 18px; z-index: 2000; transform: translate(-50%, -150%); background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 12px 18px; font-size: 14px; font-weight: 600; transition: transform .4s var(--spring); }
.toast:not(.show) { visibility: hidden; transition: transform .4s var(--spring), visibility 0s .4s; } .toast.show { transform: translate(-50%, 0); }

</style>
</head>

<script>
/* ====================== DATA ======================
   GET /tasks/:id  (live: WebSocket task.updated and runner.location)
   status: to_pickup | picked_up | arrived | late | runner_cancelled
   offline is detected on the phone (weak signal), not sent by the server.
   Add ?status=picked_up, arrived, late or runner_cancelled to the address to see each state. */
const task = {
  id: 'WD-7QK2',
  status: new URLSearchParams(location.search).get('status') || 'to_pickup',
  item: 'Calculator',
  pickup:  { name: 'New Hall',     lat: 11.9788, lng: 8.4779 },
  dropoff: { name: 'Main Library', lat: 11.9822, lng: 8.4801 },
  pin: '4092',
  eta_min: 4,
  late_min: 6, late_note: 'Sorry, the porter took time finding it.',
  pickup_photo: { taken_at: '6:41 PM' },
  runner: { name: 'Musa', photo_url: 'img/musa.svg', rating: 4.9, bag: 'Blue backpack', lat: 11.9781, lng: 8.4768 },
  /* cancel rules come from admin Rules: free for a short time after accept, then a small fee that goes to the runner */
  accepted_min_ago: 4,
  cancel: { free_minutes: 2, fee: 150 },
};
/* GET /places?site=buk-new&type=spot  (Waydrop Spots: fixed, busy handover points) */
const spots = ['Main Library entrance', 'New Hall gate', 'Coke Village junction', 'Stadium east gate'];

/* ====================== RENDER ====================== */
const $ = id => document.getElementById(id);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
const r = task.runner;
const STEP = { to_pickup: 0, late: 0, picked_up: 1, arrived: 2, runner_cancelled: 0 };

function pinRow(big) {
  return big
    ? `<div class="pin-box"><b style="font-size:14px">Check the ${task.item.toLowerCase()}, then read ${r.name} your delivery code</b><div class="pin-row">${task.pin.split('').map(d => `<span>${d}</span>`).join('')}</div></div><a class="btn btn-light" href="04c-screen-beacon.html" style="margin-top:10px"><i data-lucide="flashlight" class="ic-18"></i>Light up my screen</a>`
    : `<div class="pin-small"><i data-lucide="key-round" class="ic-18" style="color:var(--mint-fg)"></i>Delivery code<span class="d">${task.pin.split('').map(d => `<span>${d}</span>`).join('')}</span></div>`;
}

function render() {
  const s = task.status;
  $('r-photo').src = r.photo_url; $('r-name').textContent = r.name; $('r-meta').textContent = `${r.rating} rating · ${r.bag}`;
  $('eta').innerHTML = s === 'arrived' ? 'Arrived <b>now</b>' : `Arrives in <b>${task.eta_min + (s === 'late' ? task.late_min : 0)} min</b>`;
  $('steps').innerHTML = ['Accepted', 'Picked up', 'Arrived'].map((l, i) => `<div class="${i <= STEP[s] ? 'on' : ''}"><i></i>${l}</div>`).join('');

  const weak = !navigator.onLine;
  $('banner').innerHTML = weak ? `<div class="banner butter"><i data-lucide="signal-low" class="ic-18"></i><span><b>Weak signal.</b> Your delivery code still works offline, and we texted it to you too.</span></div>` : '';

  if (s === 'to_pickup' || s === 'late') {
    $('title').textContent = `${r.name} is going to the pickup`;
    $('sub').textContent = `Picking up from ${task.pickup.name}`;
    $('middle').innerHTML = (s === 'late' ? `<div class="banner butter" style="margin:12px 0 0"><i data-lucide="clock-alert" class="ic-18"></i><span><b>${r.name} is about ${task.late_min} min late.</b> "${task.late_note}"<div class="yesno"><button class="yes" id="wait">That's fine, I'll wait</button><a class="no" href="03j-finding-runner.html">Find someone else</a></div></span></div>` : '') + pinRow(false);
  }
  if (s === 'picked_up') {
    $('title').textContent = `${r.name} has your ${task.item.toLowerCase()}`;
    $('sub').textContent = `On the way to the ${task.dropoff.name}`;
    $('middle').innerHTML = `<div class="card photo"><span class="ph" aria-label="Pickup photo"></span><div><b style="font-size:14px">Pickup photo, ${task.pickup_photo.taken_at}</b><span class="caption" style="display:block">Is this your item?</span><div class="yesno"><button class="yes" id="yes">Yes, that's it</button><a class="no" href="05e-report-a-problem.html">Not my item</a></div></div></div>` + pinRow(false);
  }
  if (s === 'arrived') {
    $('title').textContent = `${r.name} is here`;
    $('sub').textContent = `At the ${task.dropoff.name} entrance`;
    $('middle').innerHTML = pinRow(true);
  }
  if (s === 'runner_cancelled') {
    $('title').textContent = `${r.name} had to cancel`;
    $('sub').textContent = 'We are finding someone new, at no extra cost.';
    $('middle').innerHTML = `<div class="card" style="margin-top:12px"><div class="row"><span class="t">Your delivery code</span><b>Still ${task.pin}</b></div><div class="row"><span class="t">Your money</span><b>Still held safely</b></div></div><a class="btn btn-dark" href="03j-finding-runner.html" style="margin-top:12px">See who's coming</a>`;
  }
  lucide.createIcons();
  const yes = $('yes'); if (yes) yes.onclick = () => { yes.textContent = 'Confirmed'; toast('Thanks. We told ' + r.name + '.'); };
  const wait = $('wait'); if (wait) wait.onclick = () => toast(`${r.name} knows you'll wait.`);
}

/* ====================== MAP ====================== */
const map = L.map('map', { zoomControl: false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
const ic = (html, size) => L.divIcon({ html, className: '', iconSize: size || null });
const pos = { to_pickup: [r.lat, r.lng], late: [r.lat, r.lng], runner_cancelled: [r.lat, r.lng], picked_up: [11.9802, 8.4789], arrived: [task.dropoff.lat - .0001, task.dropoff.lng - .0001] }[task.status];
L.marker([task.pickup.lat, task.pickup.lng], { icon: ic(`<span class="mk-tag">${task.pickup.name}</span>`) }).addTo(map);
L.marker([task.dropoff.lat, task.dropoff.lng], { icon: ic('<div class="mk-me"></div>', [22, 22]) }).addTo(map);
L.marker([task.dropoff.lat, task.dropoff.lng], { icon: ic(`<span class="mk-tag">${task.dropoff.name}</span>`) }).addTo(map);
if (task.status !== 'runner_cancelled') L.marker(pos, { icon: ic(`<div class="mk-photo"><img src="${r.photo_url}" alt=""></div>`, [44, 44]) }).addTo(map);
L.polyline([[task.pickup.lat, task.pickup.lng], [11.9802, 8.4789], [task.dropoff.lat, task.dropoff.lng]], { color: '#FF5500', weight: 4, opacity: .85, lineCap: 'round' }).addTo(map);
map.fitBounds([[task.pickup.lat, task.pickup.lng], [task.dropoff.lat, task.dropoff.lng], pos], { padding: [56, 56] });

/* ====================== INTERACTIONS ====================== */
/* POST /tasks/:id/share → link anyone can open */
$('share').addEventListener('click', async () => {
  const url = `https://waydrop.app/t/${task.id}`;
  if (navigator.share) { try { await navigator.share({ title: 'Track my errand', url }); } catch (e) {} }
  else { navigator.clipboard && navigator.clipboard.writeText(url); toast('Trip link copied'); }
});
/* ---- change or cancel ---- */
function openSheet() {
  const s = task.status, before = ['to_pickup', 'late'].includes(s);
  const free = task.accepted_min_ago <= task.cancel.free_minutes;
  let html = '';
  if (before) html += `<div class="sec-label" style="margin:16px 0 8px">Change where it goes</div><div class="chips">${spots.map(p => `<button class="chip" aria-pressed="${p.startsWith(task.dropoff.name)}" data-spot="${p}">${p}</button>`).join('')}<a class="chip" href="03c-drop-a-pin.html?for=dropoff">Somewhere else</a></div>`;
  if (before) html += `<div class="sec-label" style="margin:18px 0 8px">Cancel</div><p class="caption" style="margin:0 0 10px;font-size:14px">${free ? `Free for the first ${task.cancel.free_minutes} minutes after ${r.name} accepted.` : `${r.name} accepted ${task.accepted_min_ago} minutes ago and is on the way, so ₦${task.cancel.fee} goes to ${r.name} for their time. The rest comes back to you.`}</p><button class="btn btn-danger" id="do-cancel">${free ? 'Cancel errand' : `Cancel and pay ₦${task.cancel.fee}`}</button>`;
  else html += `<p class="caption" style="margin:10px 0 0;font-size:14px">${r.name} already has your ${task.item.toLowerCase()}, so it can't be changed or cancelled here. If something is wrong, we'll sort it with you.</p><a class="btn btn-dark" href="05e-report-a-problem.html" style="margin-top:12px">Get help</a>`;
  $('sheet-body').innerHTML = html; $('sheet').hidden = false;
}
$('manage').addEventListener('click', openSheet);
$('sheet-close').addEventListener('click', () => $('sheet').hidden = true);
$('sheet').addEventListener('click', e => {
  const sp = e.target.closest('[data-spot]');
  /* PATCH /tasks/:id { dropoff } — the runner is told straight away */
  if (sp) { document.querySelectorAll('[data-spot]').forEach(x => x.setAttribute('aria-pressed', String(x === sp))); toast(`Drop-off changed to ${sp.dataset.spot}. ${r.name} has been told.`); }
  /* POST /tasks/:id/cancel */
  if (e.target.closest('#do-cancel')) { $('sheet').hidden = true; toast('Errand cancelled. Your money is on its way back.'); setTimeout(() => location.href = '02-map-home.html', 1500); }
});

addEventListener('online', render); addEventListener('offline', render);
render();
</script>
</body>
</html>
