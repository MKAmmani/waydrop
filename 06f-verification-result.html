<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Verification · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== APP SHELL ============== */
/* Phone: full-screen page + floating bottom bar.
   Computer (1024px and up): left menu + page, like a normal web app. */
.app { min-height: 100vh; }
.side { display: none; }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .side {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh;
    padding: 20px 14px 16px; background: var(--card); border-right: 1px solid var(--border);
  }
  .bottom-bar { display: none !important; }
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font: 800 19px var(--display); letter-spacing: -.02em; }
.side-brand svg { width: 32px; height: 32px; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--ink); color: #fff; }
.nav-item .nav-badge { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--tangerine); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.nav-send { margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--r-pill); background: var(--tangerine); color: #fff; font-weight: 600; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
.side-foot .nm { font-weight: 600; font-size: 14px; } .side-foot .role { font-size: 12px; color: var(--ink-3); }

/* floating bottom bar (phone): active tab is a black circle */
.bottom-bar {
  position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40;
  height: 68px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-float);
  display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
  max-width: 440px; margin: 0 auto;
}
.bb-item { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); position: relative; }
.bb-item.active { background: var(--ink); color: #fff; }
.bb-item.send { background: var(--tangerine); color: #fff; }
.bb-item .dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--tangerine); border: 2px solid var(--card); }

/* ============== PAGE ============== */
.page { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 20px 0; }
@media (min-width: 1024px) { .page { padding-top: 32px; min-height: auto; } }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.topbar .t { flex: 1; font: 700 17px var(--display); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-1); display: grid; place-items: center; flex: none; }
.content { flex: 1; padding: 8px 0 28px; }
h1 { font: 800 28px/1.12 var(--display); letter-spacing: -.02em; margin: 6px 0 0; }
.lede { color: var(--ink-2); margin: 8px 0 22px; }
.caption { font-size: 13px; color: var(--ink-3); }

/* footer: sticky on phone, normal on computer */
.footer { position: sticky; bottom: 0; padding: 14px 0 max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to top, var(--bg) 78%, rgba(246,247,249,0)); }
@media (min-width: 1024px) { .footer { position: static; background: none; padding-bottom: 40px; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; width: 100%; border-radius: var(--r-pill); font-weight: 600; font-size: 16px; transition: transform .1s var(--ease), opacity .2s; }
.btn:active { transform: scale(.98); }
.btn-dark { background: var(--ink); color: #fff; box-shadow: 0 6px 16px rgba(15,23,42,.18); }
.btn-light { background: var(--card); color: var(--ink); box-shadow: var(--shadow-1); }
.btn-ghost { min-height: 46px; color: var(--ink-2); font-size: 15px; }
.btn-tangerine { background: var(--tangerine); color: #fff; }
.btn-mint { background: var(--mint); color: var(--ink); }
.btn-danger { background: var(--rose-tint); color: var(--rose-fg); }
.btn[aria-disabled="true"], .btn:disabled { opacity: .35; pointer-events: none; box-shadow: none; }

/* cards, rows */
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border-2); }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-size: 15px; font-weight: 600; } .row .t small { font-size: 13px; color: var(--ink-3); }
.ic-box { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.sec-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin: 24px 4px 10px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.field label { font-size: 14px; font-weight: 600; }
.field label em { font-style: normal; font-weight: 400; color: var(--ink-3); }
.input { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 16px; border-radius: var(--r-md); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); transition: box-shadow .15s; }
.input:focus-within { box-shadow: inset 0 0 0 2px var(--tangerine), 0 0 0 4px var(--tangerine-tint); }
.input input, .input textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; padding: 14px 0; resize: none; }
.hint { font-size: 13px; color: var(--ink-3); margin: 0; }

/* choice cards (radio) */
.choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; margin-top: 10px; border-radius: var(--r-lg); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); transition: box-shadow .15s; }
.choice[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.choice .t { flex: 1; } .choice b { display: block; font-size: 16px; font-weight: 600; } .choice small { font-size: 13px; color: var(--ink-3); }
.choice .r { text-align: right; font-family: var(--display); font-weight: 800; }
.choice .r small { display: block; font-family: var(--font); font-weight: 500; font-size: 12px; }

/* toggles */
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--ink-4); position: relative; flex: none; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--spring); }
.switch[aria-checked="true"] { background: var(--ink); } .switch[aria-checked="true"]::after { transform: translateX(20px); }

/* notes */
.note { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); font-size: 14px; color: var(--ink-2); margin-top: 14px; line-height: 1.45; }
.note i { flex: none; } .note b { color: var(--ink); }
.note.grey { background: var(--surface-2); } .note.mint { background: var(--mint-tint); } .note.mint i { color: var(--mint-fg); }
.note.butter { background: var(--butter-tint); } .note.butter i { color: var(--butter-fg); } .note.rose { background: var(--rose-tint); } .note.rose i { color: var(--rose-fg); }

/* pill chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--r-pill); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
[hidden] { display: none !important; }

.hero { text-align: center; padding-top: 10px; }
.big-ic { width: 92px; height: 92px; border-radius: 30px; display: grid; place-items: center; margin: 0 auto; }
.big-ic svg { width: 44px; height: 44px; }
.hero h1 { margin-top: 16px; }
.tl { position: relative; padding-left: 28px; margin-top: 18px; text-align: left; }
.tl div { position: relative; padding-bottom: 14px; }
.tl div::before { content: ""; position: absolute; left: -22px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--mint); }
.tl div::after { content: ""; position: absolute; left: -16px; top: 20px; bottom: 0; width: 2px; background: var(--border); }
.tl div:last-child::after { display: none; } .tl div.pend::before { background: var(--card); box-shadow: inset 0 0 0 2px var(--ink-4); }
.tl b { display: block; font-size: 15px; } .tl small { font-size: 13px; color: var(--ink-3); }

.toast { position: fixed; left: 50%; top: 18px; z-index: 60; transform: translate(-50%, -150%); background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 12px 18px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-float); transition: transform .4s var(--spring); max-width: calc(100% - 32px); }
.toast:not(.show) { visibility: hidden; transition: transform .4s var(--spring), visibility 0s .4s; }
.toast.show { transform: translate(-50%, 0); }

</style>
</head>

<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ====================== DATA ======================
   GET /kyc/sessions/:id  (push: kyc.updated)
   status: reviewing | approved | retry | rejected | name_mismatch | under_18 | expired | duplicate
   Add ?status=… to the address to see each one. */
const kyc = {
  status: new URLSearchParams(location.search).get('status') || 'reviewing',
  submitted_at: '9:18 PM',
  retry_reason: 'Your ID photo was blurry. We could not read the name.',
  account_name: 'Ify Chukwu', id_name: 'Chukwu, Ifeoma N.',
  eligible_on: '15 March 2027', days_left: 148,
  expired_on: 'July 2026',
  case_id: 'WD-KYC-2291',
};

/* ====================== RENDER ====================== */
const $ = id => document.getElementById(id);
const hero = (icon, bg, fg, title, text) => `<div class="big-ic" style="background:${bg};color:${fg}"><i data-lucide="${icon}"></i></div><h1>${title}</h1><p class="lede">${text}</p>`;
const btn = (cls, label, href) => href ? `<a class="btn ${cls}" href="${href}">${label}</a>` : `<button class="btn ${cls}" data-act="${label}">${label}</button>`;

const VIEWS = {
  reviewing: () => [hero('hourglass', 'var(--surface-2)', 'var(--ink-2)', 'Checking your details', 'Most checks take a few minutes. Some need a person, which can take up to 24 hours. We will notify you.'),
    `<div class="tl"><div><b>Photos received</b><small>Today, ${kyc.submitted_at}</small></div><div><b>Selfie check passed</b><small>${kyc.submitted_at}</small></div><div class="pend"><b>Final check</b><small>Usually within minutes</small></div></div>`,
    btn('btn-light', 'Send an errand while you wait', '02-map-home.html')],
  approved: () => [hero('badge-check', 'var(--mint-tint)', 'var(--mint-fg)', "You're a verified runner!", 'Your badge is on your profile. Set where you are going and errands on your way find you.'), '',
    btn('btn-mint', 'Start earning on my route', '06g-set-route.html')],
  retry: () => [hero('scan-line', 'var(--butter-tint)', 'var(--butter-fg)', 'One photo needs redoing', kyc.retry_reason + ' Your selfie was fine, so only the ID needs redoing.'),
    `<div class="note grey"><i data-lucide="lightbulb"></i><span>Lay the card flat on a dark surface, near a window, and hold the phone steady.</span></div>`,
    btn('btn-dark', 'Retake ID photo', '06b-scan-id.html') + btn('btn-ghost', 'Use a different ID', '06a-choose-id.html')],
  rejected: () => [hero('circle-x', 'var(--rose-tint)', 'var(--rose-fg)', "We couldn't verify your ID", 'A team member checked, and the face on your ID did not match your selfie closely enough.'),
    `<div class="note mint"><i data-lucide="circle-check"></i><span><b>Your account is fine.</b> You can still send errands and use your wallet. Only earning is off.</span></div>
     <div id="appeal" hidden><div class="field"><label for="why">What might have gone wrong?</label><div class="input"><textarea id="why" rows="3" placeholder="e.g. The ID photo is from 3 years ago"></textarea></div></div></div>`,
    btn('btn-dark', 'Appeal this decision') + btn('btn-ghost', 'Okay', '02-map-home.html')],
  name_mismatch: () => [hero('user-pen', 'var(--surface-2)', 'var(--ink-2)', 'Check your name', 'The name on your ID is a bit different from your Waydrop account. Which is right?'),
    `<div class="card"><div class="row"><span class="t"><small>Your account</small><b>${kyc.account_name}</b></span></div><div class="row"><span class="t"><small>On your ID</small><b>${kyc.id_name}</b></span></div></div>
     <div role="radiogroup" id="names">
       <button class="choice" role="radio" aria-checked="true"><span class="t"><b>Use my ID name</b><small>Recommended: it matches your bank account for withdrawals.</small></span></button>
       <button class="choice" role="radio" aria-checked="false"><span class="t"><b>"${kyc.account_name.split(' ')[0]}" is my nickname</b><small>Keep it on your profile. Your ID name stays private.</small></span></button>
       <button class="choice" role="radio" aria-checked="false"><span class="t"><b>My name changed</b><small>Add a document and a person will check.</small></span></button></div>`,
    btn('btn-dark', 'Continue', '06f-verification-result.html?status=reviewing')],
  under_18: () => [`<svg style="width:110px;height:110px;display:block;margin:0 auto" aria-hidden="true"><use href="#blob"/></svg><h1>You can earn from ${kyc.eligible_on}</h1><p class="lede">Runners carry other people's money and belongings, so they must be 18 or older. ${kyc.days_left} days to go.</p>`,
    `<div class="note mint"><i data-lucide="circle-check"></i><span><b>You can still send errands</b> any time. We deleted your ID photos and will ask again when you turn 18.</span></div>`,
    btn('btn-dark', 'Remind me on my birthday') + btn('btn-ghost', 'Send an errand instead', '02-map-home.html')],
  expired: () => [hero('calendar-x', 'var(--butter-tint)', 'var(--butter-fg)', `Your ID expired in ${kyc.expired_on}`, 'We can only accept IDs that are still valid. Try another one, or come back with your new card.'), '',
    btn('btn-dark', 'Use NIN instead', '06c-type-nin.html') + btn('btn-ghost', "I'll come back with my new card", '02-map-home.html')],
  duplicate: () => [hero('shield-alert', 'var(--rose-tint)', 'var(--rose-fg)', 'This ID is linked to another account', 'Each ID can only verify one Waydrop account, to stop people earning under someone else\'s name.'),
    `<div class="card"><button class="row" style="width:100%;text-align:left" data-act="old"><span class="ic-box"><i data-lucide="user-round-check" class="ic-18"></i></span><span class="t"><b>That's my old account</b><small>Help me get back in</small></span></button><button class="row" style="width:100%;text-align:left" data-act="stolen"><span class="ic-box"><i data-lucide="shield-alert" class="ic-18"></i></span><span class="t"><b>I didn't make another account</b><small>Someone may be using my ID</small></span></button></div>`,
    btn('btn-ghost', 'Use a different ID', '06a-choose-id.html')],
};
function render() {
  const [h, extra, actions] = VIEWS[kyc.status]();
  $('hero').innerHTML = h; $('extra').innerHTML = extra; $('actions').innerHTML = actions;
  lucide.createIcons();
}

/* ====================== INTERACTIONS ====================== */
document.addEventListener('click', e => {
  const n = e.target.closest('#names .choice'); if (n) document.querySelectorAll('#names .choice').forEach(x => x.setAttribute('aria-checked', String(x === n)));
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  /* POST /kyc/appeals { session_id, text } */
  if (act === 'Appeal this decision') { if ($('appeal').hidden) { $('appeal').hidden = false; a.textContent = 'Send appeal'; } else { toast(`Appeal sent. Case ${kyc.case_id}. We reply within 48 hours.`); } }
  if (act === 'Send appeal') toast(`Appeal sent. Case ${kyc.case_id}. We reply within 48 hours.`);
  if (act === 'Remind me on my birthday') toast(`We'll remind you on ${kyc.eligible_on}.`);
  /* POST /kyc/duplicate_claims { type } */
  if (act === 'old') toast('We texted a sign-in code to the number on that account.');
  if (act === 'stolen') toast('Reported. The other account is paused while we check.');
});
render();

lucide.createIcons();
</script>
</body>
</html>
