<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Calling Musa · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== CALL ============== */
.call { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: max(80px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, #1E293B, #0F172A); color: #fff; text-align: center; }
.photo { width: 128px; height: 128px; border-radius: 50%; position: relative; }
.photo img { width: 100%; height: 100%; border-radius: 50%; display: block; }
.photo::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
h1 { font: 800 30px var(--display); margin: 24px 0 4px; }
.time { color: #CBD5E1; font-variant-numeric: tabular-nums; }
.hidden-num { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 8px 14px; border-radius: var(--r-pill); background: rgba(255,255,255,.1); font-size: 13px; }
.ctrls { display: flex; gap: 22px; margin-top: auto; }
.ctrls button, .ctrls a { width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; }
.ctrls button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.ctrls .end { background: var(--rose); }
</style>
</head>
<body>
<main class="call">
  <div class="photo"><img id="photo" alt=""></div>
  <h1 id="name"></h1>
  <span class="time" id="time">Calling…</span>
  <span class="hidden-num"><i data-lucide="shield-check" class="ic-16"></i>Your number stays hidden on both sides</span>
  <div class="ctrls">
    <button aria-pressed="false" aria-label="Mute"><i data-lucide="mic-off"></i></button>
    <a class="end" href="05-track-errand.html" aria-label="End call"><i data-lucide="phone-off"></i></a>
    <button aria-pressed="false" aria-label="Speaker"><i data-lucide="volume-2"></i></button>
  </div>
</main>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
/* ====================== DATA ====================== */
/* POST /tasks/:id/call → masked call session (the phone network connects both numbers) */
const callee = { name: 'Musa', photo_url: 'img/musa.svg' };

/* ====================== RENDER + INTERACTIONS ====================== */
const $ = id => document.getElementById(id);
$('photo').src = callee.photo_url; $('name').textContent = callee.name;
let s = 0; setTimeout(() => setInterval(() => { s++; $('time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000), 2000);
document.querySelectorAll('.ctrls button').forEach(b => b.addEventListener('click', () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'))));
lucide.createIcons();
</script>
</body>
</html>
