<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Welcome · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== ONBOARDING (dark) ============== */
:root { --night: #0F172A; --night-2: #1E293B; --grid: rgba(148,163,184,.09); --muted: #94A3B8; --ease-out: cubic-bezier(.23,1,.32,1); --ease-in-out: cubic-bezier(.77,0,.175,1); }
html, body { background: var(--night); color: #fff; }
.screen { min-height: 100vh; min-height: 100dvh; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }

/* wordmark */
.brand { text-align: center; font: 800 26px var(--display); letter-spacing: -.02em; padding-top: 8px; }
.brand span { color: var(--tangerine); }

/* the scene */
.scene { position: relative; flex: 1; min-height: 340px; margin: 8px -24px 0; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.live { position: absolute; left: 24px; top: 10%; font-size: 17px; color: #E2E8F0; opacity: 0; transform: translateY(6px); transition: opacity .4s var(--ease-out), transform .4s var(--ease-out); }
.live.show { opacity: 1; transform: none; }
.live b { font: 800 30px/1 var(--display); color: #fff; display: inline-block; min-width: .6em; text-align: center; vertical-align: -3px; }
.live b.tick { animation: tick .35s var(--ease-out); }
@keyframes tick { from { transform: translateY(-8px); opacity: 0; } }

/* svg pieces */
.route-base { stroke: rgba(148,163,184,.28); stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.route-trail { stroke: var(--tangerine); stroke-width: 4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.place { font: 600 12px var(--font); fill: var(--muted); }
.who { font: 600 13px var(--font); fill: #E2E8F0; }
.end { transform-box: fill-box; transform-origin: center; }
.end.arrived { animation: land .5s var(--ease-out); }
@keyframes land { 40% { transform: scale(1.25); } }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; }
.pulse.go { animation: pulse 1.4s var(--ease-out) infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.2); opacity: 0; } }
.runner { opacity: 0; transition: opacity .3s var(--ease-out); }
.runner.show { opacity: 1; }
.code { transform-box: fill-box; transform-origin: 0% 50%; opacity: 0; transform: scale(.9); transition: opacity .3s var(--ease-out), transform .45s cubic-bezier(.34,1.56,.64,1); }
.code.show { opacity: 1; transform: none; }

/* words */
.words { padding-top: 8px; }
.words h1 { font: 800 clamp(34px, 9.5vw, 42px)/1.05 var(--display); letter-spacing: -.03em; margin: 0; max-width: 12ch; }
.words p { font-size: 18px; line-height: 1.45; color: #CBD5E1; margin: 12px 0 0; max-width: 30ch; }
.enter { opacity: 0; transform: translateY(10px); animation: enter .6s var(--ease-out) forwards; }
.enter.d2 { animation-delay: .08s; }
@keyframes enter { to { opacity: 1; transform: none; } }

/* progress + actions */
.dots { display: flex; gap: 6px; margin: 26px 0 18px; } .dots i { height: 6px; width: 6px; border-radius: 3px; background: rgba(148,163,184,.35); } .dots i.on { width: 22px; background: #fff; }
.actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: var(--r-pill); font-size: 18px; font-weight: 600; transition: transform .14s var(--ease-out), box-shadow .14s var(--ease-out); -webkit-tap-highlight-color: transparent; }
.btn:active { transform: scale(.97); }
.skip { background: var(--night-2); color: #fff; }
/* a slightly darker bottom edge so it reads as something to press */
.go { background: var(--tangerine); color: var(--night); box-shadow: inset 0 -4px 0 rgba(120,30,0,.35); }
.go:active { box-shadow: inset 0 -2px 0 rgba(120,30,0,.35); }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .enter { animation: none; opacity: 1; transform: none; }
  .pulse.go { animation: none; }
}

/* ============== ACCOUNT STEPS (dark) ============== */
.top { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.back { width: 44px; height: 44px; border-radius: 50%; background: var(--night-2); display: grid; place-items: center; color: #fff; }
.steps { flex: 1; display: flex; gap: 5px; } .steps i { flex: 1; height: 4px; border-radius: 2px; background: #334155; } .steps i.on { background: var(--tangerine); }
.body { flex: 1; padding-top: 18px; }
.body h1 { font: 800 clamp(30px, 8vw, 36px)/1.1 var(--display); letter-spacing: -.02em; margin: 0; }
.body .lede { font-size: 17px; line-height: 1.45; color: #CBD5E1; margin: 10px 0 24px; max-width: 34ch; }
.field { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.field label { font-size: 14px; font-weight: 600; color: #E2E8F0; } .field label em { font-style: normal; font-weight: 400; color: var(--muted); }
.input { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 16px; border-radius: 16px; background: var(--night-2); box-shadow: inset 0 0 0 1.5px #334155; transition: box-shadow .15s; }
.input:focus-within { box-shadow: inset 0 0 0 2px var(--tangerine), 0 0 0 4px rgba(255,85,0,.18); }
.input.bad { box-shadow: inset 0 0 0 2px var(--rose); }
.input input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: #fff; font-size: 18px; padding: 14px 0; }
.input input::placeholder { color: #64748B; }
.prefix { display: flex; align-items: center; gap: 8px; font-weight: 600; padding-right: 12px; border-right: 1px solid #334155; }
.flag { width: 22px; height: 15px; border-radius: 3px; background: linear-gradient(90deg, #008751 33%, #fff 33% 66%, #008751 66%); }
.hint { font-size: 14px; color: var(--muted); margin: 0; } .hint.bad { color: #FDA4AF; }
.foot { padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.go[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.ghost { min-height: 48px; display: flex; align-items: center; justify-content: center; color: #CBD5E1; font-weight: 600; }
.check { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; margin-top: 20px; font-size: 15px; color: #CBD5E1; }
.check .box { width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px #475569; display: grid; place-items: center; flex: none; color: transparent; font-weight: 800; transition: background-color .15s; }
.check[aria-checked="true"] .box { background: var(--tangerine); box-shadow: none; color: var(--night); }
[hidden] { display: none !important; }
.check small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--night-2); font-size: 14px; color: #CBD5E1; margin-bottom: 18px; }
.notice b { color: #fff; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(15,23,42,.25); border-top-color: var(--night); animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.promises { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 18px; }
.promises li { display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.4; color: #E2E8F0; opacity: 0; transform: translateY(8px); animation: enter .5s var(--ease-out) forwards; }
.promises li:nth-child(2) { animation-delay: .08s; } .promises li:nth-child(3) { animation-delay: .16s; }
.promises .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 18px; }
.promises b { display: block; color: #fff; }
.skip { gap: 4px; }
.hint a { color: #fff; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .promises li { animation: none; opacity: 1; transform: none; } }


/* leaving for the light sign-up steps: fade to the app background instead of a hard flash */
body { transition: background-color .32s var(--ease-out); }
body.to-light { background: #F6F7F9; }
body.to-light .screen { opacity: 0; transform: translateY(-6px); transition: opacity .25s var(--ease-out), transform .25s var(--ease-out); }
</style>
</head>
<body>

<main class="screen">
  <div class="brand" aria-label="Waydrop">Waydrop<span>.</span></div>

  <!-- the three promises, one line each -->
  <section class="body" style="padding-top:28px">
    <h1 class="enter" style="font:800 clamp(32px,9vw,40px)/1.08 var(--display);letter-spacing:-.03em;margin:0" id="title"></h1>
    <ul class="promises" id="promises"></ul>
  </section>

  <footer class="foot">
    <a class="btn go" href="01d-phone-number.html">Continue with phone number</a>
    <button class="btn skip" id="google"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>&nbsp; Continue with Google</button>
    <p class="hint" style="text-align:center;margin-top:4px" id="legal"></p>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const EASE = 'cubic-bezier(.23,1,.32,1)', MOVE = 'cubic-bezier(.77,0,.175,1)', POP = 'cubic-bezier(.34,1.56,.64,1)';
const anim = (el, frames, ms, easing = EASE, delay = 0) => el.animate(frames, { duration: ms, easing, delay, fill: 'forwards' }).finished;

/* ====================== DATA ====================== */
/* Static copy. Google sign-in: POST /auth/google { id_token } (same account as the phone number once linked). */
const copy = {
  title: 'One account to send, buy and earn.',
  promises: [
    ['#FF8A4C', 'rgba(255,85,0,.14)', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>', "It comes to you", 'A student already heading your way brings it.'],
    ['#FFC94A', 'rgba(255,201,74,.14)', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>', 'Your money is held', 'Paid only when you give the runner your code.'],
    ['#6EE7B7', 'rgba(16,185,129,.14)', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 12 2 2 4-4"/></svg>', 'Runners are verified students', 'ID and selfie checked before they can carry anything.'],
  ],
  legal: 'By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>. New here or coming back, use the same steps.',
};

/* ====================== RENDER ====================== */
$('title').textContent = copy.title;
$('promises').innerHTML = copy.promises.map(([fg, bg, ic, t, s]) => `<li><span class="ic" style="background:${bg};color:${fg}" aria-hidden="true">${ic}</span><span><b>${t}</b>${s}</span></li>`).join('');
$('legal').innerHTML = copy.legal;
document.querySelector('a.go').addEventListener('click', e => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  e.preventDefault(); const href = e.currentTarget.href; document.body.classList.add('to-light');
  setTimeout(() => location.href = href, 320);
});
/* coming back with the Back button: undo the fade */
addEventListener('pageshow', () => document.body.classList.remove('to-light'));
$('google').addEventListener('click', () => location.href = '01f-name-and-photo.html');

</script>
</body>
</html>
