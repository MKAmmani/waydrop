<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delivering · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== APP SHELL ============== */
/* Phone: full-screen page + floating bottom bar.
   Computer (1024px and up): left menu + page, like a normal web app. */
.app { min-height: 100vh; }
.side { display: none; }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .side {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh;
    padding: 20px 14px 16px; background: var(--card); border-right: 1px solid var(--border);
  }
  .bottom-bar { display: none !important; }
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font: 800 19px var(--display); letter-spacing: -.02em; }
.side-brand svg { width: 32px; height: 32px; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--ink); color: #fff; }
.nav-item .nav-badge { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--tangerine); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.nav-send { margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--r-pill); background: var(--tangerine); color: #fff; font-weight: 600; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
.side-foot .nm { font-weight: 600; font-size: 14px; } .side-foot .role { font-size: 12px; color: var(--ink-3); }

/* floating bottom bar (phone): active tab is a black circle */
.bottom-bar {
  position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40;
  height: 68px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-float);
  display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
  max-width: 440px; margin: 0 auto;
}
.bb-item { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); position: relative; }
.bb-item.active { background: var(--ink); color: #fff; }
.bb-item.send { background: var(--tangerine); color: #fff; }
.bb-item .dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--tangerine); border: 2px solid var(--card); }

.track { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
.map-area { position: relative; height: 46vh; flex: none; }
#map { position: absolute; inset: 0; background: #EEF0F3; }
.leaflet-tile-pane { filter: saturate(.35) brightness(1.03); }
.leaflet-control-attribution { font-size: 10px; }
.mk-photo { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(15,23,42,.2); overflow: hidden; }
.mk-photo img { width: 100%; height: 100%; display: block; }
.mk-me { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 4px solid #fff; box-shadow: 0 0 0 10px rgba(255,85,0,.16); }
.mk-tag { display: inline-block; transform: translate(-50%, -150%); white-space: nowrap; background: #fff; border-radius: var(--r-pill); padding: 5px 10px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow-1); }
.float-btn { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; z-index: 500; width: 46px; height: 46px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-2); display: grid; place-items: center; }
.panel { flex: 1; margin-top: -24px; position: relative; z-index: 600; background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 20px 20px 32px; }
.panel-inner { max-width: 560px; margin: 0 auto; }
.panel h1 { font: 800 24px/1.15 var(--display); margin: 0; }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink-4); }
.steps3 i { display: block; height: 5px; border-radius: 4px; background: var(--border); margin-bottom: 6px; }
.steps3 .on { color: var(--ink); } .steps3 .on i { background: var(--mint); }
.budget { margin-top: 16px; padding: 14px 16px; }
.bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-top: 10px; } .bar i { display: block; height: 100%; background: var(--mint); }
.receipt { display: flex; gap: 12px; align-items: center; margin-top: 12px; padding: 12px; }
.receipt .ph { width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #D6C2A8, #B89A78); flex: none; }
.who { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 16px; }
.who img { width: 48px; height: 48px; border-radius: 50%; }
.who .t { flex: 1; }
.act { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; width: 100%; border-radius: var(--r-pill); font-weight: 600; font-size: 16px; }
.btn-dark { background: var(--ink); color: #fff; } .btn-light { background: var(--card); box-shadow: var(--shadow-1); }
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.caption { font-size: 13px; color: var(--ink-3); }
/* decision sheet (price check, swap) */
.sheet-dim { position: fixed; inset: 0; z-index: 1000; background: rgba(15,23,42,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 22px 20px max(26px, env(safe-area-inset-bottom)); animation: up .4s var(--spring); }
@keyframes up { from { transform: translateY(100%); } }
.ask-card { position: relative; border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--border); }
.ask-card::before, .ask-card::after { content: ""; position: absolute; top: 78px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.ask-card::before { left: -9px; clip-path: inset(0 0 0 50%); } .ask-card::after { right: -9px; clip-path: inset(0 50% 0 0); }
.ask-top { padding: 16px; border-bottom: 1px dashed var(--border); min-height: 86px; }
.ask-top .k { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--tangerine-fg); }
.timer { background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 4px 10px; font: 700 13px var(--font); font-variant-numeric: tabular-nums; }
.ask-top h2 { font: 800 19px/1.2 var(--display); margin: 8px 0 0; }
.ask-bottom { padding: 12px 16px; }
.calc { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; color: var(--ink-2); } .calc b { font-family: var(--display); color: var(--ink); }
.row2 { display: flex; gap: 10px; margin-top: 10px; }
@media (min-width: 1024px) { .track { flex-direction: row; } .map-area { height: 100vh; flex: 1; order: 2; } .panel { order: 1; width: 440px; flex: none; margin: 0; border-radius: 0; overflow-y: auto; height: 100vh; } .float-btn { display: none; } }
[hidden] { display: none !important; }

.watch { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 74px; right: 16px; z-index: 500; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: var(--r-pill); background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; }
.watch .live { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(16,185,129,.3); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-2); font-size: 14px; }
.row:last-child { border-bottom: 0; } .row .t { flex: 1; color: var(--ink-2); } .row b { font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stats div { padding: 12px; border-radius: var(--r-md); background: var(--card); box-shadow: var(--shadow-1); }
.stats small { display: block; font-size: 12px; color: var(--ink-3); } .stats b { font: 800 18px var(--display); }
.row2 { display: flex; gap: 10px; margin-top: 12px; }
/* offer ticket (from the reference: notches, dashed line, timer pill, one black button) */
.offer { position: relative; margin-top: 4px; background: var(--card); border-radius: var(--r-xl); box-shadow: var(--shadow-2); }
.offer::before, .offer::after { content: ""; position: absolute; top: 104px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.offer::before { left: -11px; } .offer::after { right: -11px; }
.offer .o-top { display: flex; align-items: center; gap: 12px; padding: 18px; border-bottom: 1px dashed var(--border); min-height: 115px; }
.offer .o-top img { width: 52px; height: 52px; border-radius: 50%; }
.offer .o-top .earn { margin-left: auto; text-align: right; } .offer .o-top .earn b { display: block; font: 800 26px var(--display); color: var(--mint-fg); }
.offer .o-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px 18px; }
.offer .o-mid small { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); } .offer .o-mid b { display: block; font: 800 17px/1.2 var(--display); margin-top: 4px; }
.offer .o-timer { display: flex; justify-content: space-between; align-items: center; margin: 0 18px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.offer .o-timer b { background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 4px 12px; font: 700 14px var(--font); font-variant-numeric: tabular-nums; }
.offer .o-act { padding: 16px 18px 18px; border-top: 1px dashed var(--border); margin-top: 16px; }
.wp { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.wp.done { opacity: .45; } .wp.done b { text-decoration: line-through; }
.wp .t { flex: 1; } .wp small { display: block; font-size: 12px; color: var(--ink-3); } .wp b { font-size: 15px; }
.dot-pick { width: 16px; height: 16px; border-radius: 50%; border: 4px solid var(--tangerine); flex: none; }
.dot-drop { width: 16px; height: 16px; border-radius: 50%; background: var(--tangerine); flex: none; }
.checks button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border-2); font-size: 15px; }
.checks button:last-child { border-bottom: 0; }
.checks .box { width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--ink-4); display: grid; place-items: center; color: #fff; flex: none; }
.checks [aria-checked="true"] .box { background: var(--mint); box-shadow: none; }
.note-paper { margin-top: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--butter-tint); font-size: 14px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; top: 18px; z-index: 2000; transform: translate(-50%, -150%); background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 12px 18px; font-size: 14px; font-weight: 600; transition: transform .4s var(--spring); }
.toast:not(.show) { visibility: hidden; transition: transform .4s var(--spring), visibility 0s .4s; } .toast.show { transform: translate(-50%, 0); }

</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
const map = L.map('map', { zoomControl: false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
const ic = (html, size) => L.divIcon({ html, className: '', iconSize: size || null });

/* ====================== DATA ======================
   GET /tasks/:id (runner view). Steps move forward with:
   POST /tasks/:id/arrived_pickup → POST /tasks/:id/pickup_photo (multipart) → POST /tasks/:id/arrived_dropoff
   step: to_pickup | at_pickup | to_dropoff | at_dropoff   (add ?step=… to see each) */
const step = new URLSearchParams(location.search).get('step') || 'to_pickup';
const task = {
  item: 'Lab coat', earn: 450,
  requester: { name: 'Chidi', photo_url: 'img/chidi.svg', rating: 4.8 },
  pickup:  { name: "New Hall, porter's desk", at: [11.9790, 8.4783], dist: '250m' },
  dropoff: { name: 'Main Library entrance',   at: [11.9822, 8.4801], dist: '400m' },
  note: 'Ask the porter for the coat in a white bag, name Chidi.',
  checks: ["It's a lab coat, in a white bag", 'The name on it is Chidi', 'Nothing looks damaged'],
  you: { to_pickup: [11.9781, 8.4775], at_pickup: [11.9790, 8.4783], to_dropoff: [11.9804, 8.4790], at_dropoff: [11.9821, 8.4800] },
};

/* ====================== RENDER ====================== */
const picked = ['to_dropoff', 'at_dropoff'].includes(step);
const who = `<div class="card who"><img src="${task.requester.photo_url}" alt=""><div class="t"><b>${task.requester.name}</b><span class="caption" style="display:block">★ ${task.requester.rating} as a requester</span></div><a class="act" href="05b-call.html" aria-label="Call"><i data-lucide="phone" class="ic-18"></i></a><a class="act" href="05a-chat.html" aria-label="Message"><i data-lucide="message-circle" class="ic-18"></i></a></div>`;
const stops = `<div class="card" style="margin-top:12px"><div class="wp ${picked ? 'done' : ''}"><i class="dot-pick"></i><div class="t"><small>Pick up</small><b>${task.pickup.name}</b></div><span class="caption">${picked ? '' : task.pickup.dist}</span></div><div class="wp"><i class="dot-drop"></i><div class="t"><small>Drop off</small><b>${task.dropoff.name}</b></div><span class="caption">${task.dropoff.dist}</span></div></div>`;
const help = `<div class="row2"><a class="btn btn-ghost" href="06l-delivery-problems.html"><i data-lucide="triangle-alert" class="ic-16"></i>Problem</a><a class="btn btn-ghost" href="06l-delivery-problems.html?view=cancel">Cancel errand</a></div>`;

const VIEWS = {
  to_pickup: `<span class="caption">${task.item} for ${task.requester.name} · you earn ${naira(task.earn)}</span><h1>Head to the pickup</h1>${stops}<div class="note-paper">"${task.note}"</div>${who}<a class="btn btn-dark" href="?step=at_pickup" style="margin-top:12px">I'm at the pickup</a>${help}`,
  at_pickup: `<h1>Check it before you take it</h1><p class="caption" style="font-size:14px;margin:4px 0 12px">Tick each one. This protects you if anything is questioned later.</p>
    <div class="card checks" id="checks">${task.checks.map(c => `<button role="checkbox" aria-checked="false"><span class="box"><i data-lucide="check" class="ic-16"></i></span>${c}</button>`).join('')}</div>
    <label class="btn btn-dark" id="photo" style="margin-top:12px;opacity:.35;pointer-events:none"><i data-lucide="camera" class="ic-18"></i>Take pickup photo<input type="file" accept="image/*" capture="environment" hidden id="file"></label>${help}`,
  to_dropoff: `<span class="caption">Picked up · photo sent to ${task.requester.name}</span><h1>Head to the drop-off</h1>${stops}${who}<a class="btn btn-dark" href="?step=at_dropoff" style="margin-top:12px">I've arrived</a>${help}`,
  at_dropoff: `<h1>Hand it over, then ask for the delivery code</h1><p class="caption" style="font-size:14px;margin:4px 0 12px">Only take the code once ${task.requester.name} has the ${task.item.toLowerCase()} in hand. Never hand over without it.</p>${who}
    <button class="btn btn-light" id="beacon" style="margin-top:12px"><i data-lucide="flashlight" class="ic-18"></i>Ask ${task.requester.name} to light up their screen</button>
    <a class="btn btn-dark" href="06j-enter-delivery-code.html" style="margin-top:10px"><i data-lucide="key-round" class="ic-18"></i>Enter ${task.requester.name}'s delivery code</a>
    <a class="btn btn-ghost" href="06l-delivery-problems.html?view=no_show">${task.requester.name} isn't here</a>`,
};
$('panel').innerHTML = VIEWS[step];

/* ====================== INTERACTIONS ====================== */
const checks = $('checks');
if (checks) checks.addEventListener('click', e => { const b = e.target.closest('[role=checkbox]'); if (!b) return;
  b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true'));
  const all = [...checks.children].every(x => x.getAttribute('aria-checked') === 'true');
  $('photo').style.opacity = all ? 1 : .35; $('photo').style.pointerEvents = all ? 'auto' : 'none'; });
const file = $('file'); if (file) file.addEventListener('change', () => { if (file.files.length) location.href = '?step=to_dropoff'; });
const beacon = $('beacon'); if (beacon) beacon.onclick = () => toast(`${task.requester.name}'s screen is flashing orange now.`);

/* ====================== MAP ====================== */
L.marker(task.pickup.at, { icon: ic(`<span class="mk-tag">${picked ? '✓ ' : ''}Pick up</span>`) }).addTo(map);
L.marker(task.dropoff.at, { icon: ic('<span class="mk-tag">Drop off</span>') }).addTo(map);
L.marker(task.you[step], { icon: ic('<div class="mk-me"></div>', [22, 22]) }).addTo(map);
L.polyline(picked ? [task.you[step], task.dropoff.at] : [task.you[step], task.pickup.at, task.dropoff.at], { color: '#FF5500', weight: 4, lineCap: 'round', dashArray: picked ? null : '1 8' }).addTo(map);
map.fitBounds([task.pickup.at, task.dropoff.at, task.you[step]], { padding: [60, 60] });

lucide.createIcons();
</script>
</body>
</html>
