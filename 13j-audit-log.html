<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Audit log · Desk · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== DESK SHELL ============== */
body { background: #F4F6F8; font-size: 14px; }
.desk { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.nav { position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 2px; padding: 18px 12px; background: var(--card); border-right: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; font: 800 18px var(--display); }
.brand svg { width: 30px; height: 30px; } .brand span { font: 700 11px var(--font); color: var(--ink-3); background: var(--surface-2); border-radius: 5px; padding: 2px 6px; }
.ngrp { font-size: 11px; font-weight: 700; color: var(--ink-4); letter-spacing: .06em; text-transform: uppercase; padding: 14px 10px 6px; }
.nl { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); font-weight: 500; }
.nl:hover { background: var(--surface-2); }
.nl.on { background: var(--ink); color: #fff; }
.nl em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 700; min-width: 22px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; background: var(--tangerine); color: #fff; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.me img { width: 32px; height: 32px; border-radius: 50%; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: rgba(244,246,248,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.search { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink-3); }
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 14px; }
.site { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font-weight: 600; }
.site i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px var(--mint-tint); }
.pg { padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 16px; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ph h1 { font: 800 24px/1.15 var(--display); letter-spacing: -.02em; margin: 0; }
.ph p { margin: 4px 0 0; color: var(--ink-3); }
@media (max-width: 900px) { .panel { overflow-x: auto; } table { min-width: 560px; } .pg { padding: 16px; } .rail, .kv { grid-template-columns: 1fr 1fr !important; } .desk { grid-template-columns: minmax(0, 1fr); } .nav { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; max-width: 100vw; border-right: 0; border-bottom: 1px solid var(--border); } .nl { flex: none; } .brand { padding-bottom: 2px; flex: none; } .search { min-width: 0; } .site { display: none; } .ngrp, .me { display: none; } .top { position: static; } }

/* ============== PIECES ============== */
/* grid children may shrink; wide tables scroll inside their panel instead of widening the page */
.pg > *, .grid2 > *, .cg > *, .kyc > *, .grid2 > * > * { min-width: 0; }
.panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--border); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-2); }
.panel-h b { font-size: 14px; } .panel-h small { color: var(--ink-3); font-size: 12px; }
.b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.b-dark { background: var(--ink); color: #fff; } .b-line { background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.b-mint { background: var(--mint); color: var(--ink); } .b-danger { background: var(--card); color: var(--rose-fg); box-shadow: inset 0 0 0 1px rgba(225,29,72,.3); }
.b:disabled, .b[aria-disabled="true"] { opacity: .4; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.c-mint { background: var(--mint-tint); color: var(--mint-fg); } .c-butter { background: var(--butter-tint); color: var(--butter-fg); }
.c-rose { background: var(--rose-tint); color: var(--rose-fg); } .c-grey { background: var(--surface-2); color: var(--ink-2); } .c-tan { background: var(--tangerine-tint); color: var(--tangerine-fg); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 700; color: var(--ink-4); letter-spacing: .05em; text-transform: uppercase; padding: 10px 16px; border-bottom: 1px solid var(--border-2); }
td { padding: 11px 16px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.r { text-align: right; } .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-3); } .n { font: 800 14px var(--display); }
.tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border-2); flex-wrap: wrap; }
.tabs button { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kv div { padding: 14px 16px; border-right: 1px solid var(--border-2); } .kv div:last-child { border-right: 0; }
.kv small { display: block; font-size: 12px; color: var(--ink-3); } .kv b { font: 800 20px var(--display); }
.ok { color: var(--mint-fg); } .warn { color: var(--butter-fg); } .bad { color: var(--rose-fg); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.tl { padding: 12px 16px; } .tli { display: grid; grid-template-columns: 74px 14px 1fr; gap: 10px; padding-bottom: 12px; font-size: 13px; }
.tli time { color: var(--ink-3); font-size: 12px; } .tli i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--mint); }
.tli.red i { background: var(--rose); } .tli.orange i { background: var(--tangerine); } .tli small { display: block; color: var(--ink-3); }
.ledger { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #F6F8FA; box-shadow: inset 0 0 0 1px var(--border-2); font: 12px ui-monospace, Menlo, monospace; }
.ledger .lh { display: flex; justify-content: space-between; font: 700 11px var(--font); color: var(--ink-4); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.ledger .ln { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.ledger .plus { color: var(--mint-fg); } .ledger .minus { color: var(--rose-fg); }
.ledger .sum { font: 600 12px var(--font); color: var(--mint-fg); margin-top: 6px; }
.fld { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; } .fld label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fld input, .fld textarea, .fld select { background: var(--surface-2); border: 1px solid transparent; border-radius: 9px; padding: 9px 11px; font-size: 14px; outline: 0; }
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--tangerine); background: #fff; }
.tg { width: 40px; height: 24px; border-radius: 12px; background: var(--ink-4); position: relative; flex: none; transition: background-color .2s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.tg[aria-checked="true"] { background: var(--ink); } .tg[aria-checked="true"]::after { transform: translateX(16px); }
.empty { padding: 32px; text-align: center; color: var(--ink-3); }
/* reason dialog: no money or account action without a reason */
.scrim { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(15,23,42,.35); }
.scrim.show { display: flex; }
.modal { width: 460px; max-width: 92vw; background: var(--card); border-radius: 16px; box-shadow: 0 24px 60px rgba(15,23,42,.25); padding: 20px; }
.modal h3 { font: 800 18px var(--display); margin: 0; } .modal p { color: var(--ink-3); margin: 4px 0 0; font-size: 13px; }
.mrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 150%); background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 18px; font-weight: 600; box-shadow: var(--shadow-float); transition: transform .35s var(--spring); }
.toast:not(.show) { visibility: hidden; transition: transform .35s var(--spring), visibility 0s .35s; } .toast.show { transform: translate(-50%, 0); }
[hidden] { display: none !important; }

.filters { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-2); flex-wrap: wrap; }
.filters select, .filters input { height: 36px; border-radius: 9px; border: 0; background: var(--surface-2); padding: 0 10px; font-size: 13px; outline: 0; }

</style>

<script>

const $ = id => document.getElementById(id);
const naira = n => (n < 0 ? '−' : '') + '₦' + Math.abs(Math.round(n)).toLocaleString('en-NG');
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }

/* Badges in the menu. GET /admin/counts */
const counts = { queue: 9, payouts: 2, places: 3 };
document.querySelectorAll('[data-count]').forEach(e => { const n = counts[e.dataset.count]; if (n) { e.textContent = n; e.hidden = false; } });

/* Reason dialog. Every money or account action needs a reason; it goes to the audit log
   (POST /admin/actions { action, target, reason, note }). */
function ask({ title, text, reasons, cta, danger, onOk }) {
  $('modal').innerHTML = `<h3>${title}</h3><p>${text}</p>
    ${reasons ? `<div class="fld"><label for="m-reason">Reason</label><select id="m-reason">${reasons.map(r => `<option>${r}</option>`).join('')}</select></div>` : ''}
    <div class="fld"><label for="m-note">Note for the audit log ${reasons ? '(optional)' : '(required)'}</label><textarea id="m-note" rows="2"></textarea></div>
    <div class="mrow"><button class="b b-line" id="m-cancel">Cancel</button><button class="b ${danger ? 'b-danger' : 'b-dark'}" id="m-ok">${cta}</button></div>`;
  $('scrim').classList.add('show');
  $('m-cancel').onclick = () => $('scrim').classList.remove('show');
  $('m-ok').onclick = () => {
    if (!reasons && $('m-note').value.trim().length < 4) { $('m-note').focus(); return; }
    $('scrim').classList.remove('show'); onOk && onOk();
  };
}
$('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') $('scrim').classList.remove('show'); });


/* ====================== DATA ====================== */
/* GET /admin/audit?who=&action=&q=&cursor= ; GET /admin/audit.csv */
const log = [
  ['9:31 PM', 'Funmi A.', 'Approved ID check',   'Tobi Adeyemi',               'Student ID matches selfie and name'],
  ['9:20 PM', 'Funmi A.', 'Decided dispute',     'WD-4821',                    'Full refund, Waydrop pays runner: damaged on the way'],
  ['9:12 PM', 'Kunle O.', 'Retried payout',      'WD-PAY-1188',                'Bank back online'],
  ['8:58 PM', 'Funmi A.', 'Changed rule',        'offer_seconds: 20 → 25',     'Walkers missed offers while crossing roads'],
  ['8:40 PM', 'System',   'Locked handover',     'WD-T9K4',                    '5 wrong delivery codes'],
  ['8:02 PM', 'System',   'Planned routines',    '41 errands to 17 walkers',   'Nightly plan'],
  ['7:15 PM', 'Funmi A.', 'Approved place name', 'Back gate of New Hall',      '₦50 naming reward'],
  ['6:40 PM', 'Bisi O.',  'Added a Spot',        'Senate building steps',      'Busy, well-lit, near lecture halls'],
];

/* ====================== RENDER ====================== */
const uniq = i => ['All', ...new Set(log.map(r => r[i]))];
$('who').innerHTML = uniq(1).map(v => `<option>${v}</option>`).join('');
$('what').innerHTML = uniq(2).map(v => `<option>${v}</option>`).join('');
function render() {
  const w = $('who').value, a = $('what').value, q = $('q').value.toLowerCase();
  const rows = log.filter(r => (w === 'All' || r[1] === w) && (a === 'All' || r[2] === a) && (!q || r.join(' ').toLowerCase().includes(q)));
  $('rows').innerHTML = rows.map(([t, w, a, o, r]) => `<tr><td class="mono">${t}</td><td>${w}</td><td><b>${a}</b></td><td>${o}</td><td class="caption">${r}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No matching entries.</td></tr>';
}

/* ====================== INTERACTIONS ====================== */
['who', 'what', 'q'].forEach(id => $(id).addEventListener('input', render));
$('export').addEventListener('click', () => {
  const csv = ['time,who,action,on,reason', ...log.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'waydrop-audit-log.csv'; a.click();
});
render();

lucide.createIcons();
</script>
</body>
</html>
