<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>How paying works · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== ONBOARDING (dark) ============== */
:root { --night: #0F172A; --night-2: #1E293B; --grid: rgba(148,163,184,.09); --muted: #94A3B8; --ease-out: cubic-bezier(.23,1,.32,1); --ease-in-out: cubic-bezier(.77,0,.175,1); }
html, body { background: var(--night); color: #fff; }
.screen { min-height: 100vh; min-height: 100dvh; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }

/* wordmark */
.brand { text-align: center; font: 800 26px var(--display); letter-spacing: -.02em; padding-top: 8px; }
.brand span { color: var(--tangerine); }

/* the scene */
.scene { position: relative; flex: 1; min-height: 340px; margin: 8px -24px 0; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.live { position: absolute; left: 24px; top: 10%; font-size: 17px; color: #E2E8F0; opacity: 0; transform: translateY(6px); transition: opacity .4s var(--ease-out), transform .4s var(--ease-out); }
.live.show { opacity: 1; transform: none; }
.live b { font: 800 30px/1 var(--display); color: #fff; display: inline-block; min-width: .6em; text-align: center; vertical-align: -3px; }
.live b.tick { animation: tick .35s var(--ease-out); }
@keyframes tick { from { transform: translateY(-8px); opacity: 0; } }

/* svg pieces */
.route-base { stroke: rgba(148,163,184,.28); stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.route-trail { stroke: var(--tangerine); stroke-width: 4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.place { font: 600 12px var(--font); fill: var(--muted); }
.who { font: 600 13px var(--font); fill: #E2E8F0; }
.end { transform-box: fill-box; transform-origin: center; }
.end.arrived { animation: land .5s var(--ease-out); }
@keyframes land { 40% { transform: scale(1.25); } }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; }
.pulse.go { animation: pulse 1.4s var(--ease-out) infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.2); opacity: 0; } }
.runner { opacity: 0; transition: opacity .3s var(--ease-out); }
.runner.show { opacity: 1; }
.code { transform-box: fill-box; transform-origin: 0% 50%; opacity: 0; transform: scale(.9); transition: opacity .3s var(--ease-out), transform .45s cubic-bezier(.34,1.56,.64,1); }
.code.show { opacity: 1; transform: none; }

/* words */
.words { padding-top: 8px; }
.words h1 { font: 800 clamp(34px, 9.5vw, 42px)/1.05 var(--display); letter-spacing: -.03em; margin: 0; max-width: 12ch; }
.words p { font-size: 18px; line-height: 1.45; color: #CBD5E1; margin: 12px 0 0; max-width: 30ch; }
.enter { opacity: 0; transform: translateY(10px); animation: enter .6s var(--ease-out) forwards; }
.enter.d2 { animation-delay: .08s; }
@keyframes enter { to { opacity: 1; transform: none; } }

/* progress + actions */
.dots { display: flex; gap: 6px; margin: 26px 0 18px; } .dots i { height: 6px; width: 6px; border-radius: 3px; background: rgba(148,163,184,.35); } .dots i.on { width: 22px; background: #fff; }
.actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: var(--r-pill); font-size: 18px; font-weight: 600; transition: transform .14s var(--ease-out), box-shadow .14s var(--ease-out); -webkit-tap-highlight-color: transparent; }
.btn:active { transform: scale(.97); }
.skip { background: var(--night-2); color: #fff; }
/* a slightly darker bottom edge so it reads as something to press */
.go { background: var(--tangerine); color: var(--night); box-shadow: inset 0 -4px 0 rgba(120,30,0,.35); }
.go:active { box-shadow: inset 0 -2px 0 rgba(120,30,0,.35); }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .enter { animation: none; opacity: 1; transform: none; }
  .pulse.go { animation: none; }
}

.pay { position: absolute; left: 24px; right: 24px; top: 18%; height: 190px; }
.party { position: absolute; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.party small { color: var(--muted); font-size: 13px; font-weight: 600; }
#you { left: 0; } #runner { right: 0; }
.face { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: #1E293B; border: 2px solid #475569; font-weight: 700; }
#runner img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff; }
.vault { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.vault svg { position: static; width: 64px; height: 64px; }
.vault small { color: var(--muted); font-size: 13px; font-weight: 600; transition: color .3s; }
.vault.locked small { color: #FFC94A; } .vault.open small { color: #6EE7B7; }
#shackle { transition: transform .45s cubic-bezier(.34,1.56,.64,1), stroke .3s; transform-origin: 44px 28px; }
.vault.locked #shackle { stroke: #FFC94A; }
.vault.open #shackle { transform: translateY(-6px) rotate(25deg); stroke: #6EE7B7; }
.coin { position: absolute; left: 0; top: 0; padding: 8px 12px; border-radius: 999px; background: var(--tangerine); color: var(--night); font: 800 15px var(--display); opacity: 0; white-space: nowrap; }
.coin.small { font-size: 13px; background: #10B981; } .coin.grey { background: #334155; color: #E2E8F0; }
.codechip { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; padding: 8px 16px; border-radius: 12px; background: #1E293B; border: 1px solid rgba(16,185,129,.45); opacity: 0; }
.codechip small { color: var(--muted); font-size: 11px; } .codechip b { font: 800 18px var(--display); letter-spacing: 4px; color: #6EE7B7; }
.status { position: absolute; left: 24px; right: 24px; bottom: 6%; text-align: center; color: #E2E8F0; font-size: 16px; min-height: 24px; margin: 0; }

</style>
</head>
<body>

<main class="screen">

  <!-- wordmark -->
  <div class="brand" aria-label="Waydrop">Waydrop<span>.</span></div>

  <!-- scene -->
  <section class="scene" aria-hidden="true">

    <!-- you, the held money, the runner -->
    <div class="pay">
      <div class="party" id="you"><span class="face">You</span><small>Adaeze</small></div>
      <div class="vault" id="vault">
        <svg viewBox="0 0 64 64" width="64" height="64"><rect x="10" y="28" width="44" height="30" rx="9" fill="#1E293B" stroke="#475569" stroke-width="2"/><path id="shackle" d="M20 28 V20 a12 12 0 0 1 24 0 V28" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="42" r="4" fill="#94A3B8"/></svg>
        <small id="vault-t">Held safely</small>
      </div>
      <div class="party" id="runner"><img src="img/musa.svg" alt=""><small>Musa</small></div>
      <span class="coin" id="coin">₦500</span>
      <span class="coin small" id="pay1">₦450 to Musa</span>
      <span class="coin small grey" id="pay2">₦50 fee</span>
      <span class="codechip" id="code"><small>Delivery code</small><b>4092</b></span>
    </div>
    <p class="status" id="status"></p>
  </section>

  <!-- words -->
  <section class="words">
    <h1 class="enter" id="title"></h1>
    <p class="enter d2" id="text"></p>
  </section>

  <!-- progress + actions -->
  <div class="dots" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-label="Step 2 of 3"><i class=""></i><i class="on"></i><i class=""></i></div>
  <div class="actions">
    <a class="btn skip" href="01c-welcome.html">Skip</a>
    <a class="btn go" href="01b-earn-on-your-way.html">Continue</a>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const EASE = 'cubic-bezier(.23,1,.32,1)', MOVE = 'cubic-bezier(.77,0,.175,1)', POP = 'cubic-bezier(.34,1.56,.64,1)';
const anim = (el, frames, ms, easing = EASE, delay = 0) => el.animate(frames, { duration: ms, easing, delay, fill: 'forwards' }).finished;

/* ====================== DATA ====================== */
const copy = {
  title: "Paid only when it's in your hands.",
  text: 'We hold your money while the errand runs. The runner gets paid the moment you give them your code.',
  held: 'Held safely', released: 'Released',
  steps: ['You pay ₦500. We hold it.', 'Musa is on the way…', 'Musa is here. You give your code.', 'Musa is paid. You have your calculator.'],
};
$('title').textContent = copy.title; $('text').textContent = copy.text;

/* ====================== ANIMATION ======================
   Money goes from you into the lock → runner arrives → code given → lock opens, money splits to runner and fee. */
const pos = (el) => { const r = el.getBoundingClientRect(), p = $('coin').offsetParent.getBoundingClientRect(); return [r.left - p.left + r.width / 2, r.top - p.top + r.height / 2]; };
const at = (el, [x, y]) => `translate(${x - el.offsetWidth / 2}px, ${y - el.offsetHeight / 2}px)`;
function say(t) { $('status').textContent = t; }
async function loop() {
  const coin = $('coin'), you = pos($('you').firstElementChild), vault = pos($('vault').firstElementChild), runner = pos($('runner').firstElementChild);
  $('vault').className = 'vault'; [coin, $('pay1'), $('pay2'), $('code')].forEach(e => e.style.opacity = 0);
  say(copy.steps[0]);
  await anim(coin, [{ transform: at(coin, you), opacity: 0 }, { transform: at(coin, you), opacity: 1 }], 300);
  await anim(coin, [{ transform: at(coin, you), opacity: 1 }, { transform: at(coin, vault), opacity: 1, offset: .85 }, { transform: at(coin, vault) + ' scale(.6)', opacity: 0 }], 1100, MOVE);
  $('vault').classList.add('locked'); $('vault-t').textContent = copy.held;
  say(copy.steps[1]);
  await wait(1200);
  say(copy.steps[2]);
  await anim($('code'), [{ opacity: 0, transform: 'translateX(-50%) scale(.9)' }, { opacity: 1, transform: 'translateX(-50%) scale(1)' }], 450, POP);
  await wait(700);
  $('vault').className = 'vault open'; $('vault-t').textContent = copy.released;
  const p1 = $('pay1'), p2 = $('pay2');
  anim(p2, [{ transform: at(p2, vault), opacity: 0 }, { transform: at(p2, [vault[0] - 104, vault[1] + 96]), opacity: 1 }], 700, EASE, 150);
  await anim(p1, [{ transform: at(p1, vault), opacity: 0 }, { transform: at(p1, [runner[0] - 34, runner[1] + 96]), opacity: 1 }], 900, MOVE);
  say(copy.steps[3]);
  await wait(2600);
  await Promise.all([p1, p2, $('code')].map(e => anim(e, [{ opacity: 1 }, { opacity: 0 }], 300)));
  loop();
}
if (reduce) { $('vault').className = 'vault open'; $('vault-t').textContent = copy.released; $('code').style.opacity = 1; say(copy.steps[3]); }
else setTimeout(loop, 400);

</script>
</body>
</html>
