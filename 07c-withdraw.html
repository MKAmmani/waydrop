<html lang="en">
<head>
<meta charset="utf-8" />

<title>Withdraw · Waydrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  /* surfaces: soft off-white page, white cards */
  --bg:        #F6F7F9;
  --card:      #FFFFFF;
  --surface-2: #F1F3F6;
  --border:    #ECEEF2;
  --border-2:  #F3F4F7;
  /* ink: one dark, three greys */
  --ink:   #0F172A;
  --ink-2: #4B5565;
  --ink-3: #8A93A3;
  --ink-4: #C3C9D3;
  /* Waydrop colours, used sparingly */
  --tangerine:      #FF5500;
  --tangerine-fg:   #C63D00;
  --tangerine-tint: #FFF1E9;
  --mint:      #10B981;
  --mint-fg:   #047857;
  --mint-tint: #E9F8F2;
  --butter:      #FFC94A;
  --butter-fg:   #92400E;
  --butter-tint: #FFF7DE;
  --rose:      #E11D48;
  --rose-fg:   #BE123C;
  --rose-tint: #FFEDF1;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* shadows you barely notice */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  --shadow-2: 0 2px 6px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
  --shadow-float: 0 6px 24px rgba(15,23,42,.12);

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 10px; }

/* lucide icon defaults: one weight everywhere */
[data-lucide] { width: 20px; height: 20px; stroke-width: 1.75; flex-shrink: 0; }
.ic-16 { width: 16px; height: 16px; }
.ic-18 { width: 18px; height: 18px; }
.ic-22 { width: 22px; height: 22px; }
.ic-24 { width: 24px; height: 24px; }

.caption { font-size: 13px; color: var(--ink-3); }
.money { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ============== APP SHELL ============== */
/* Phone: full-screen page + floating bottom bar.
   Computer (1024px and up): left menu + page, like a normal web app. */
.app { min-height: 100vh; }
.side { display: none; }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .side {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh;
    padding: 20px 14px 16px; background: var(--card); border-right: 1px solid var(--border);
  }
  .bottom-bar { display: none !important; }
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font: 800 19px var(--display); letter-spacing: -.02em; }
.side-brand svg { width: 32px; height: 32px; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--ink); color: #fff; }
.nav-item .nav-badge { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--tangerine); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.nav-send { margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: var(--r-pill); background: var(--tangerine); color: #fff; font-weight: 600; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid var(--border); }
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
.side-foot .nm { font-weight: 600; font-size: 14px; } .side-foot .role { font-size: 12px; color: var(--ink-3); }

/* floating bottom bar (phone): active tab is a black circle */
.bottom-bar {
  position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40;
  height: 68px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-float);
  display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
  max-width: 440px; margin: 0 auto;
}
.bb-item { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); position: relative; }
.bb-item.active { background: var(--ink); color: #fff; }
.bb-item.send { background: var(--tangerine); color: #fff; }
.bb-item .dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--tangerine); border: 2px solid var(--card); }

/* ============== PAGE ============== */
.page { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 20px 0; }
@media (min-width: 1024px) { .page { padding-top: 32px; min-height: auto; } }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.topbar .t { flex: 1; font: 700 17px var(--display); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-1); display: grid; place-items: center; flex: none; }
.content { flex: 1; padding: 8px 0 28px; }
h1 { font: 800 28px/1.12 var(--display); letter-spacing: -.02em; margin: 6px 0 0; }
.lede { color: var(--ink-2); margin: 8px 0 22px; }
.caption { font-size: 13px; color: var(--ink-3); }

/* footer: sticky on phone, normal on computer */
.footer { position: sticky; bottom: 0; padding: 14px 0 max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to top, var(--bg) 78%, rgba(246,247,249,0)); }
@media (min-width: 1024px) { .footer { position: static; background: none; padding-bottom: 40px; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; width: 100%; border-radius: var(--r-pill); font-weight: 600; font-size: 16px; transition: transform .1s var(--ease), opacity .2s; }
.btn:active { transform: scale(.98); }
.btn-dark { background: var(--ink); color: #fff; box-shadow: 0 6px 16px rgba(15,23,42,.18); }
.btn-light { background: var(--card); color: var(--ink); box-shadow: var(--shadow-1); }
.btn-ghost { min-height: 46px; color: var(--ink-2); font-size: 15px; }
.btn-tangerine { background: var(--tangerine); color: #fff; }
.btn-mint { background: var(--mint); color: var(--ink); }
.btn-danger { background: var(--rose-tint); color: var(--rose-fg); }
.btn[aria-disabled="true"], .btn:disabled { opacity: .35; pointer-events: none; box-shadow: none; }

/* cards, rows */
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border-2); }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-size: 15px; font-weight: 600; } .row .t small { font-size: 13px; color: var(--ink-3); }
.ic-box { width: 40px; height: 40px; border-radius: 13px; background: var(--surface-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.sec-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin: 24px 4px 10px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.field label { font-size: 14px; font-weight: 600; }
.field label em { font-style: normal; font-weight: 400; color: var(--ink-3); }
.input { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 16px; border-radius: var(--r-md); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); transition: box-shadow .15s; }
.input:focus-within { box-shadow: inset 0 0 0 2px var(--tangerine), 0 0 0 4px var(--tangerine-tint); }
.input input, .input textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; padding: 14px 0; resize: none; }
.hint { font-size: 13px; color: var(--ink-3); margin: 0; }

/* choice cards (radio) */
.choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; margin-top: 10px; border-radius: var(--r-lg); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); transition: box-shadow .15s; }
.choice[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.choice .t { flex: 1; } .choice b { display: block; font-size: 16px; font-weight: 600; } .choice small { font-size: 13px; color: var(--ink-3); }
.choice .r { text-align: right; font-family: var(--display); font-weight: 800; }
.choice .r small { display: block; font-family: var(--font); font-weight: 500; font-size: 12px; }

/* toggles */
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--ink-4); position: relative; flex: none; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--spring); }
.switch[aria-checked="true"] { background: var(--ink); } .switch[aria-checked="true"]::after { transform: translateX(20px); }

/* notes */
.note { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); font-size: 14px; color: var(--ink-2); margin-top: 14px; line-height: 1.45; }
.note i { flex: none; } .note b { color: var(--ink); }
.note.grey { background: var(--surface-2); } .note.mint { background: var(--mint-tint); } .note.mint i { color: var(--mint-fg); }
.note.butter { background: var(--butter-tint); } .note.butter i { color: var(--butter-fg); } .note.rose { background: var(--rose-tint); } .note.rose i { color: var(--rose-fg); }

/* pill chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--r-pill); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
[hidden] { display: none !important; }

.amount { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin: 10px 0; }
.amount span { font: 800 30px var(--display); color: var(--ink-3); }
.amount input { font: 800 52px var(--display); border: 0; outline: 0; background: none; width: 220px; text-align: center; }
.method { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-top: 10px; border-radius: var(--r-lg); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.method[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.method .head { display: flex; align-items: center; gap: 12px; }
.method .head .t { flex: 1; } .method b { display: block; font-size: 15px; } .method small { font-size: 13px; color: var(--ink-3); }
.method .more { display: none; margin-top: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
.method[aria-checked="true"] .more { display: block; }
.num { font: 800 24px var(--display); }
.done { width: 84px; height: 84px; border-radius: 50%; background: var(--mint); color: #fff; display: grid; place-items: center; margin: 40px auto 0; }

.bank { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; margin-top: 10px; border-radius: var(--r-lg); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.bank[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.logo { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; font: 800 13px var(--display); flex: none; }
.bank .t { flex: 1; } .bank b { display: block; font-size: 15px; } .bank small { font-size: 13px; color: var(--ink-3); }
.default { font-size: 11px; font-weight: 700; color: var(--mint-fg); background: var(--mint-tint); border-radius: var(--r-pill); padding: 3px 8px; }
.dots { display: flex; gap: 14px; justify-content: center; margin: 20px 0 8px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink-3); }
.dots span.f { background: var(--ink); box-shadow: none; }
.dots.bad { animation: shake .35s; } .dots.bad span.f { background: var(--rose); }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.pad button { height: 60px; border-radius: var(--r-md); background: var(--card); box-shadow: var(--shadow-1); font: 800 24px var(--display); }
.result { text-align: center; padding-top: 30px; }
.result .big { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }

</style>
</head>

<script>


/* ====================== DATA ====================== */
/* GET /wallet ; GET /wallet/banks ; GET /me/security → has_wallet_pin */
const wallet = { available: 4850, min_withdrawal: 500 };
const banks = [
  { id: 'b1', bank: 'Kuda',   color: '#40196D', last4: '0912', name: 'Adaeze Okafor', default: true },
  { id: 'b2', bank: 'GTBank', color: '#E05206', last4: '2210', name: 'Adaeze Okafor' },
];
const security = { has_wallet_pin: true, max_pin_tries: 3 };
/* POST /wallet/withdrawals { amount, bank_id, pin }  (Idempotency-Key) → { status: sent | failed, ref }
   POST /me/wallet_pin { pin } the first time.
   The check below stands in for the server so the page works on its own. */
async function withdraw(pin) { return pin === '2580' ? { status: 'sent', ref: 'WD-PAY-1201' } : { status: 'wrong_pin' }; }

/* ====================== STATE + RENDER ====================== */
const $ = id => document.getElementById(id);
const naira = n => '₦' + Math.round(n).toLocaleString('en-NG');
let step = 'amount', amount = 2000, bank = banks.find(b => b.default).id, pin = '', firstPin = '', tries = 0;
const creating = !security.has_wallet_pin;

function show(s) {
  step = s;
  ['amount', 'bank', 'pin', 'result'].forEach(x => $('s-' + x).hidden = x !== s);
  $('next').hidden = s === 'pin' || s === 'result';
  paint();
}
function paint() {
  $('avail').textContent = `Available ${naira(wallet.available)}`;
  $('amt').value = amount ? amount.toLocaleString('en-NG') : '';
  $('quick').innerHTML = [1000, 2000, wallet.available].map(q => `<button class="chip" aria-pressed="${q === amount}" data-q="${q}">${q === wallet.available ? 'All ' + naira(q) : naira(q)}</button>`).join('');
  const bad = amount < wallet.min_withdrawal || amount > wallet.available;
  $('hint').textContent = amount > wallet.available ? "That's more than you have available." : amount < wallet.min_withdrawal ? `The minimum is ${naira(wallet.min_withdrawal)}.` : 'Free · usually arrives in under a minute';
  $('hint').style.color = bad ? 'var(--rose-fg)' : '';
  $('next').disabled = step === 'amount' && bad;
  $('banks').innerHTML = banks.map(b => `<button class="bank" role="radio" aria-checked="${b.id === bank}" data-b="${b.id}"><span class="logo" style="background:${b.color}">${b.bank.slice(0, 2).toUpperCase()}</span><span class="t"><b>${b.bank} •• ${b.last4}</b><small>${b.name}</small></span>${b.default ? '<span class="default">Default</span>' : ''}</button>`).join('');
  const b = banks.find(x => x.id === bank);
  $('summary').innerHTML = `<div class="row"><span class="t">Amount</span><b>${naira(amount)}</b></div><div class="row"><span class="t">To</span><b>${b.bank} •• ${b.last4}</b></div><div class="row"><span class="t">Fee</span><b>Free</b></div>`;
  $('forgot').hidden = creating;
  $('pin-title').textContent = creating ? (firstPin ? 'Enter it again to confirm' : 'Create a 4-digit wallet PIN') : 'Enter your wallet PIN';
  document.querySelectorAll('#dots span').forEach((d, i) => d.classList.toggle('f', i < pin.length));
  lucide.createIcons();
}
$('pad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}" aria-label="${k === 'del' ? 'Delete' : k}">${k === 'del' ? '<i data-lucide="delete"></i>' : k}</button>`).join('');

function result(ok, ref) {
  const b = banks.find(x => x.id === bank);
  $('s-result').innerHTML = ok
    ? `<div class="big" style="background:var(--mint);color:#fff"><i data-lucide="check" class="ic-24"></i></div><h1 style="margin-top:16px">${naira(amount)} is on its way</h1><p class="lede">To ${b.bank} •• ${b.last4}. Usually lands in under a minute. If the bank sends it back, it returns to your wallet by itself.</p><p class="caption">Reference ${ref}</p><a class="btn btn-dark" href="07-wallet.html" style="margin-top:12px">Done</a>`
    : `<div class="big" style="background:var(--butter-tint);color:var(--butter-fg)"><i data-lucide="undo-2" class="ic-24"></i></div><h1 style="margin-top:16px">${naira(amount)} is back in your wallet</h1><p class="lede">${b.bank} didn't accept the transfer. It happens when a bank is having problems. Nothing was lost.</p><button class="btn btn-dark" id="other">Send to another bank</button>`;
  show('result');
  const o = $('other'); if (o) o.onclick = () => show('bank');
}

/* ====================== INTERACTIONS ====================== */
$('amt').addEventListener('input', e => { amount = +e.target.value.replace(/\D/g, '') || 0; paint(); $('amt').focus(); });
$('quick').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { amount = +b.dataset.q; paint(); } });
$('banks').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b) { bank = b.dataset.b; paint(); } });
$('next').addEventListener('click', () => show(step === 'amount' ? 'bank' : 'pin'));
$('pad').addEventListener('click', async e => {
  const k = e.target.closest('[data-k]'); if (!k) return;
  if (k.dataset.k === 'del') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k.dataset.k;
  paint(); if (pin.length < 4) return;
  if (creating && !firstPin) { firstPin = pin; pin = ''; return paint(); }
  if (creating && pin !== firstPin) { $('pin-msg').textContent = "Those didn't match. Start again."; firstPin = ''; pin = ''; return paint(); }
  const res = await withdraw(creating ? '2580' : pin);
  if (res.status === 'wrong_pin') {
    tries++; $('dots').classList.add('bad');
    $('pin-msg').textContent = tries >= security.max_pin_tries ? 'Too many tries. Your wallet PIN is locked for 5 minutes.' : `Wrong PIN. ${security.max_pin_tries - tries} tries left.`;
    $('pin-msg').style.color = 'var(--rose-fg)';
    setTimeout(() => { $('dots').classList.remove('bad'); pin = ''; paint(); }, 450);
    return;
  }
  result(res.status === 'sent', res.ref);
});
show(new URLSearchParams(location.search).get('result') === 'failed' ? 'amount' : 'amount');
if (new URLSearchParams(location.search).get('result') === 'failed') result(false);

lucide.createIcons();
</script>
</body>
</html>
